<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="src/styles.css">

  <script src="/src/script.js" defer></script>
  <script src="/src/contadorDeTarefas.js" defer></script>

  <title>Kanban</title>
</head>

<body>

  <header>
    <h1>Kanban</h1>
    <hr class="linha-titulo">
  </header>
  <main>
    <section class="colunas" id="inColunas">

      <section class="coluna">
        <section class="coluna-titulo coluna-to-do">
          <h3 data-tarefas="0">To Do</h3>
          <!--<p id="qtdTarefas">0</p>-->
          <button data-add id="bntAdd"><i class="bi bi-plus to-do"></i></button>
        </section>
        <section class="tarefas"></section>
      </section>

      <section class="coluna">
        <section class="coluna-titulo coluna-in-progress">
          <h3 data-tarefas="0">In Progress</h3>
          <button data-add><i class="bi bi-plus in-progress"></i></button>
        </section>
        <section class="tarefas"></section>
      </section>
      <section class="coluna">
        <section class="coluna-titulo coluna-completed">
          <h3 data-tarefas="0">Completed</h3>
          <button data-add><i class="bi bi-plus completed"></i></button>
        </section>
        <section class="tarefas"></section>
      </section>

      <!-- Criar modal -->
      <dialog class="confirma-modal">
        <form method="dialog">
          <h2>Deseja deletar tarefa?</h2>
          <p>Você irá excluir a seguinte tarefa</p>
          <div class="preview"></div>
          <menu>
            <button type="button" id="inCancela">Cancelar</button>
            <button type="submit" id="inConfirma">Sim, deletar tarefa.</button>
          </menu>
        </form>
      </dialog>
  </main>
  <footer>
    <p><a href="https://github.com/suanebc">GitHub</a> <a
        href="https://www.linkedin.com/in/suane-bittencourt-dev/">Linkedin</a></p>

    <span>&copy; <span id="year"> </span>SuaneBC - Todos os direitos reservados </span>
  </footer>
</body>

</html>
